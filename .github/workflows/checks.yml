name: Project checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mandatelens_test
          POSTGRES_USER: mandatelens_dev
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mandatelens_dev -d mandatelens_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mandatelens_dev:ci_only_password@127.0.0.1:5432/mandatelens_test
      TEST_DATABASE_URL: postgresql+psycopg://mandatelens_dev:ci_only_password@127.0.0.1:5432/mandatelens_test
      NEO4J_ENABLED: "false"
      RUN_MIGRATIONS: "false"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
