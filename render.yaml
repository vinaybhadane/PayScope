databases:
  - name: payscope-db
    databaseName: mandatelens
    user: payscope
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: payscope-api
    runtime: python
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: pip install uv && uv sync --locked
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: API_HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: payscope-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: payscope-db
          property: connectionString
      - key: API_SESSION_SECRET
        generateValue: true
      - key: ALLOW_GUEST_SESSIONS
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: EMAIL_WORKER_ENABLED
        value: "true"
      - key: EMAIL_REMINDER_INTERVAL_SECONDS
        value: "3600"
      - key: NEO4J_ENABLED
        value: "false"
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: https://payscope-web.onrender.com

  - type: web
    name: payscope-web
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: API_BASE_URL
        value: https://payscope-api-08he.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: PayScope
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
