databases:
  - name: payscope-db
    databaseName: mandatelens
    user: payscope
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: payscope-api
    runtime: python
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: pip install uv && uv sync --locked
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: API_HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: POSTGRES_PASSWORD
        value: npg_BvOlyD6h1EMn
      - key: DATABASE_URL
        value: postgresql+psycopg://neondb_owner:npg_BvOlyD6h1EMn@ep-calm-fog-az6aivg7-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: API_SESSION_SECRET
        generateValue: true
      - key: ALLOW_GUEST_SESSIONS
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: payscope18
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: EMAIL_WORKER_ENABLED
        value: "true"
      - key: EMAIL_REMINDER_INTERVAL_SECONDS
        value: "3600"
      - key: NEO4J_ENABLED
        value: "false"
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: https://payscope-web.onrender.com,https://pay-scope-lake.vercel.app,https://payscope.vercel.app

  - type: web
    name: payscope-web
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: API_BASE_URL
        value: https://payscope-api-08he.onrender.com
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://payscope-api-08he.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://payscope-api-08he.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: PayScope
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyCMi4MDAtJhPfqCgBhXNYQgHaglgSQf0vA
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: payscope18.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: payscope18
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: payscope18.firebasestorage.app
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: "104812680638"
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: 1:104812680638:web:f68d549e42ef8a845015ef
